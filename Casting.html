<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Casting Anime</title>
    <link rel='stylesheet' href='style.css'>
    <link rel="icon" type="image/png" href="icon.1.png">
    <style>
        header{
           display: flex;
           justify-content: space-between;
           align-items: center;
           margin: 30px;
           position: fixed, top=0px, left=0px;
           width: 96%;
           z-index: 100;
        }

        header #logo{
           font-size: 30px;
        }

        header nav ul{
           display: flex;
           justify-content: center;
           align-items: center;
           list-style: none;
        }

        header nav ul li{
           margin-right: 30px;
        }

        header nav ul li a{
           padding: 6px 15px;
           border-radius: 30px;
        }

        header nav ul li a:hover,#Casting{
           background: orange;
           color: #3a0229;
        }
    </style>
</head>
<body>
   <header>
      <h2><a href="#" id="logo">Casting</a></h2>
      <nav class="navbar">
          <ul class="nav-menu">
            <li><a href="Home.html" id="home">Home</a></li>
            <li><a href="Aura.html" id="aura">Aura</a></li>
            <li><a href="Library.html" id="Library">Library</a></li>
            <li><a href="AnimeQuotes.html" id="AnimeQuotes">AnimeQuotes</a></li>
            <li><a href="Casting.html" id="Casting">Casting</a></li>
         </ul>
      </nav>
   </header>

   <div class="casting">
      <section class="opinion">
         <h2>share your opinion with us</h2>
         <form action="#" method="POST">
            <div class="info">
               <label for="username"> Your Name:</label>
               <input type="text" id="username" name="username" placeholder="enter your name" required>
            </div>

            <div class="info">
               <label for="anime-title">Anime Name:</label>
               <input type="text" id="anime-title" name="anime-title" placeholder="enter the anime name" required>
            </div>

            <div class="info">
               <label for="comment">Your Comment:</label>
               <textarea id="comment" name="comment" rows="5" placeholder="Enter Your Comment" required></textarea>
            </div>

            <button type="submit">Send</button>
         </form>
      </section>

   <script src="main.js"></script>
</body>
</html>
